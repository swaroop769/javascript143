<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      padding: 0px;
      margin: 0px;
      box-sizing: border-box;
      }
    body{
    background: black;
    }
    .main{
      width: 50vw;
      height: 50vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: aqua;
      align-items: center;
      align-content: center;
      gap: 20px;
      padding: 20px;
      margin: 100px auto;
    }
    .int{
      margin-bottom: 20px;
    }
    input{
     border-radius: 20px;
     padding-left: 10px;
    }
    button{
      border-radius: 20px;
      padding: 5px;
    }
  </style>
  
</head>
<body>
  <div class="main">
  <form id="signupForm">
  <input type="text" id="username" placeholder="username" class="int" required /></br>
  <input type="email" id="email" placeholder="email" class="int" required /></br>
  <input type="password" id="password" placeholder="password" class="int" minlength="6" required /></br>
  <input type="password" id="cnfPassword" placeholder="Confirm Password" class="int" required /></br>
  <button>signup</button>
  </form>
  <div id="signupResult"></div>
  </div>
  <script src="./practice2.js"></script>
</body>
</html>
